  <style>
    body {
      background-color: #0E0E0F;
      color: #73FFE3;
      font-family: 'Space Mono', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .glitch-box {
      width: 60px;
      height: 60px;
      border: 2px solid #73FFE3;
      box-shadow: 0 0 15px rgba(115, 255, 227, 0.4);
      margin-bottom: 30px;
      animation: flip 2s infinite cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    @keyframes flip {
      0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
      50% { transform: perspective(120px) rotateX(-180.1deg) rotateY(0deg); background-color: rgba(115, 255, 227, 0.2); }
      100% { transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg); }
    }
    .loading-text {
      font-size: 14px;
      letter-spacing: 6px;
      font-weight: 700;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0E0E0F;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s ease-in-out;
    }
  </style>
</head>

<body>
<div id="loading-overlay">
  <div class="glitch-box"></div>
  <div class="loading-text">[ SYSTEM_INITIALIZING ]</div>
</div>

<script>
  window.addEventListener('load', function() {
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.addedNodes.length > 0) {
          for (let i = 0; i < mutation.addedNodes.length; i++) {
            let node = mutation.addedNodes[i];
            if (node.tagName && node.tagName.toLowerCase() === 'flutter-view') {
              // Wait 200ms to allow flutter to paint its first frame
              setTimeout(function(){
                const overlay = document.getElementById('loading-overlay');
                if(overlay) {
                  overlay.style.opacity = '0';
                  setTimeout(() => overlay.remove(), 1200);
                }
              }, 200);
              observer.disconnect();
            }
          }
        }
      });
    });
    observer.observe(document.body, { childList: true });
  });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
