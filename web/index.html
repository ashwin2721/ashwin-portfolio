<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ashwin K | Portfolio</title>
  <meta name="description" content="Hi, I'm Ashwin K — a Flutter and MERN Stack Developer passionate about creating responsive web and mobile applications.">
  <meta name="author" content="Ashwin K">
  <meta name="keywords" content="Ashwin K, Portfolio, Flutter Developer, MERN Stack Developer, Web Developer, App Developer">

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ashwin Portfolio">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      color: #26E0A6;
      font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .spinner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 5px solid rgba(38, 224, 166, 0.2);
      border-top-color: #26E0A6;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(38, 224, 166, 0.4);
      margin-bottom: 30px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 18px;
      letter-spacing: 6px;
      font-weight: 600;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
<div class="spinner"></div>
<div class="loading-text">LOADING...</div>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
